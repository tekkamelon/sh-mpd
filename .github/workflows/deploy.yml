name: deploy

on:
  push:
    branches: [main]

# 実行中の deploy を中断すると stop/rm の途中で本番が止まり得るため
# cancel-in-progress は付けない。連続 push は直列に待機させて順次収束させる。
concurrency:
  group: deploy

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: update working tree
        id: tree
        run: |
          set -eu
          cd ~/Documents/github/sh-mpd
          git update-index --skip-worktree cgi-bin/settings/shmpd.conf || true
          git fetch origin main
          if git rev-parse --verify main >/dev/null 2>&1; then
            git checkout main
          else
            git checkout -B main origin/main
          fi
          git reset --hard origin/main
          NEW=$(git rev-parse HEAD)
          echo "tree at ${NEW}"
          # 再ビルド要否は「稼働中コンテナに焼き込まれた rev」(ビルド時ラベル) との
          # 比較で判定する。ツリーの HEAD が基準だと、ビルド失敗 -> rerun のとき
          # ツリーは既に新 main に進んでいるため OLD=NEW となり、未反映の変更を
          # 永久に検出できなくなる。
          DEPLOYED=$(docker inspect shmpd --format '{{index .Config.Labels "sh-mpd.rev"}}' 2>/dev/null || echo none)
          if [ -z "${DEPLOYED}" ]; then
            DEPLOYED=none
          fi
          echo "deployed image rev: ${DEPLOYED}"
          # ラベルが読めない (コンテナ無し・旧イメージでラベル無し) か、焼き込み
          # ファイル (Dockerfile の COPY 対象) に差分があれば再ビルド。
          # 判定できないときは再ビルド側へ倒す (反映漏れよりコンテナ再作成を優先)。
          CHANGED=$(git diff --name-only "${DEPLOYED}" "${NEW}" -- tools/Dockerfile tools/apache-shmpd.conf tools/entrypoint.sh bin/urldecode 2>/dev/null || echo FORCE)
          if [ "${DEPLOYED}" = "none" ] || [ -n "${CHANGED}" ]; then
            echo "image_changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "image_changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: rebuild image and recreate container
        if: steps.tree.outputs.image_changed == 'true'
        run: |
          set -eu
          cd ~/Documents/github/sh-mpd
          # 稼働中イメージを退避タグへ保存する (run 失敗時のロールバック用)
          docker image tag sh-mpd-at:latest sh-mpd-at:rollback || true
          # ビルドが失敗したときに稼働中のコンテナを止めてしまわないよう、ビルドを先に行う
          docker build -f tools/Dockerfile \
            --label "sh-mpd.rev=$(git rev-parse HEAD)" \
            -t sh-mpd-at:trixie -t sh-mpd-at:latest .
          # Apache 設定はイメージへ焼き込むため、反映にはコンテナの作り直しが必要
          # (at のスプールは named volume shmpd-atspool に入っており作り直しても消えない)
          docker container stop shmpd || true
          docker container rm shmpd || true
          if ! sh tools/docker_shmpd.sh sh-mpd-at:latest ; then
            echo "container run failed; rolling back to sh-mpd-at:rollback" >&2
            sh tools/docker_shmpd.sh sh-mpd-at:rollback
            exit 1
          fi

      - name: verify deployment
        if: steps.tree.outputs.image_changed == 'true'
        run: |
          set -eu
          # 稼働中コンテナが今回ビルドした rev と一致することを確認する (反映の証明)
          REV=$(git rev-parse HEAD)
          RUNREV=$(docker inspect shmpd --format '{{index .Config.Labels "sh-mpd.rev"}}' 2>/dev/null || echo none)
          if [ "${RUNREV}" != "${REV}" ]; then
            echo "deploy check failed: running image rev is ${RUNREV}, expected ${REV}" >&2
            exit 1
          fi
          # コンテナの起動と Apache の応答を待つ (2秒 x 10 で最大20秒)
          i=0
          until [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/cgi-bin/index.cgi)" = "200" ]; do
            i=$((i + 1))
            if [ "$i" -ge 10 ]; then
              echo "deploy check failed: index.cgi did not return 200" >&2
              exit 1
            fi
            sleep 2
          done
          # スモーク: 機密 conf が配信されないこと
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/cgi-bin/settings/shmpd.conf)
          if [ "${code}" != "403" ]; then
            echo "deploy check failed: shmpd.conf returned ${code} (expected 403)" >&2
            exit 1
          fi
          echo "deployed: image ${REV} running (index.cgi=200, settings/shmpd.conf=403)"

      - name: summary
        if: steps.tree.outputs.image_changed != 'true'
        run: |
          echo "deployed: working tree only (image-baked files unchanged, container untouched)"
