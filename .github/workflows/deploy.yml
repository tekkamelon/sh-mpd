name: deploy

on:
  push:
    branches: [main]

# 実行中の deploy を中断すると stop/rm の途中で本番が止まり得るため
# cancel-in-progress は付けない。連続 push は直列に待機させて順次収束させる。
concurrency:
  group: deploy

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: update working tree
        id: tree
        run: |
          set -eu
          cd ~/Documents/github/sh-mpd
          git update-index --skip-worktree cgi-bin/settings/shmpd.conf || true
          git fetch origin main
          if git rev-parse --verify main >/dev/null 2>&1; then
            git checkout main
          else
            git checkout -B main origin/main
          fi
          git reset --hard origin/main
          NEW=$(git rev-parse HEAD)
          echo "tree at ${NEW}"
          # 再ビルド要否は「稼働中コンテナに焼き込まれた rev」(ビルド時ラベル) との
          # 比較で判定する。ツリーの HEAD が基準だと、ビルド失敗 -> rerun のとき
          # ツリーは既に新 main に進んでいるため OLD=NEW となり、未反映の変更を
          # 永久に検出できなくなる。
          DEPLOYED=$(docker inspect shmpd --format '{{index .Config.Labels "sh-mpd.rev"}}' 2>/dev/null || echo none)
          if [ -z "${DEPLOYED}" ]; then
            DEPLOYED=none
          fi
          echo "deployed image rev: ${DEPLOYED}"
          # ラベルが読めない (コンテナ無し・旧イメージでラベル無し) か、焼き込み
          # ファイル (Dockerfile の COPY 対象) に差分があれば再ビルド。
          # 判定できないときは再ビルド側へ倒す (反映漏れよりコンテナ再作成を優先)。
          CHANGED=$(git diff --name-only "${DEPLOYED}" "${NEW}" -- tools/Dockerfile tools/apache-shmpd.conf tools/entrypoint.sh bin/urldecode 2>/dev/null || echo FORCE)
          if [ "${DEPLOYED}" = "none" ] || [ -n "${CHANGED}" ]; then
            echo "image_changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "image_changed=false" >> "${GITHUB_OUTPUT}"
          fi

      # 現行本番のスモーク。常に実行し、不合格なら次ステップの再ビルドへ倒す
      # (verify を image_changed 時に限定したままだと、壊れた状態に CGI のみの
      # マージが来たとき再ビルドも検証も飛んで green になってしまうため)。
      - name: smoke check
        id: smoke
        run: |
          set -eu
          smoke() {
            # index.cgi は MPD 不達でも 200 ("Connection Error" ページ) を返すため、
            # この待ちは「Apache が応答しているか」の確認として働く
            i=0
            until [ "$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1/cgi-bin/index.cgi)" = "200" ]; do
              i=$((i + 1))
              if [ "$i" -ge 10 ]; then
                return 1
              fi
              sleep 2
            done
            # スモーク: 機密 conf が配信されていないこと
            code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1/cgi-bin/settings/shmpd.conf)
            if [ "${code}" != "403" ]; then
              return 1
            fi
            return 0
          }
          if smoke ; then
            echo "smoke_ok=true" >> "${GITHUB_OUTPUT}"
            echo "smoke: index.cgi=200, settings/shmpd.conf=403"
          else
            echo "smoke_ok=false" >> "${GITHUB_OUTPUT}"
            echo "smoke failed: production not serving or conf exposed; trying rebuild" >&2
          fi

      - name: rebuild image and recreate container
        id: rebuild
        if: steps.tree.outputs.image_changed == 'true' || steps.smoke.outputs.smoke_ok == 'false'
        run: |
          set -eu
          cd ~/Documents/github/sh-mpd
          echo "done=true" >> "${GITHUB_OUTPUT}"
          # 稼働中コンテナのイメージ ID を退避タグへ保存する (失敗時のロールバック用)。
          # latest でなく稼働中の ID に付けることで、前回 rollback 済みのときも
          # 「実際に動いているイメージ」を退避できる。
          RUNNING=$(docker inspect shmpd --format '{{.Image}}' 2>/dev/null || true)
          if [ -n "${RUNNING}" ]; then
            docker image tag "${RUNNING}" sh-mpd-at:rollback || true
          fi
          # ビルドが失敗したときに稼働中のコンテナを止めてしまわないよう、ビルドを先に行う
          docker build -f tools/Dockerfile \
            --label "sh-mpd.rev=$(git rev-parse HEAD)" \
            -t sh-mpd-at:trixie -t sh-mpd-at:latest .
          # a2enconf も docker build も Apache の構文を検証しないため、
          # 稼働中コンテナを止める前にイメージ内で configtest を通す
          # (構文エラーのまま起動するとコンテナが即 exit し、旧コンテナは
          #  既に消えているため本番停止になる)
          docker run --rm --entrypoint sh sh-mpd-at:latest \
            -c 'APACHE_CONFDIR=/etc/apache2; . /etc/apache2/envvars; apache2ctl configtest'
          # Apache 設定はイメージへ焼き込むため、反映にはコンテナの作り直しが必要
          # (at のスプールは named volume shmpd-atspool に入っており作り直しても消えない)
          docker container stop shmpd || true
          docker container rm shmpd || true
          if ! sh tools/docker_shmpd.sh sh-mpd-at:latest ; then
            echo "container run failed; rolling back to sh-mpd-at:rollback" >&2
            sh tools/docker_shmpd.sh sh-mpd-at:rollback
            exit 1
          fi

      - name: verify deployment
        if: success() && steps.rebuild.outputs.done == 'true'
        run: |
          set -eu
          # 稼働中コンテナが今回ビルドした rev と一致することを確認する (反映の証明)
          REV=$(git rev-parse HEAD)
          RUNREV=$(docker inspect shmpd --format '{{index .Config.Labels "sh-mpd.rev"}}' 2>/dev/null || echo none)
          if [ "${RUNREV}" != "${REV}" ]; then
            echo "deploy check failed: running image rev is ${RUNREV}, expected ${REV}" >&2
            exit 1
          fi
          # コンテナの起動と Apache の応答を待つ (2秒 x 10 で最大20秒)
          i=0
          until [ "$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1/cgi-bin/index.cgi)" = "200" ]; do
            i=$((i + 1))
            if [ "$i" -ge 10 ]; then
              echo "deploy check failed: index.cgi did not return 200" >&2
              exit 1
            fi
            sleep 2
          done
          # スモーク: 機密 conf が配信されないこと
          code=$(curl -s --max-time 5 -o /dev/null -w '%{http_code}' http://127.0.0.1/cgi-bin/settings/shmpd.conf)
          if [ "${code}" != "403" ]; then
            echo "deploy check failed: shmpd.conf returned ${code} (expected 403)" >&2
            exit 1
          fi
          echo "deployed: image ${REV} running (index.cgi=200, settings/shmpd.conf=403)"

      # 何かが失敗したときの自動復帰。稼働中コンテナが既に退避イメージなら
      # (ビルド/configtest 失敗で swap 前に止まったか、run 失敗で既に引き戻した)
      # 何もしない。新イメージ (または無し) なら退避イメージで作り直す。
      - name: rollback on failure
        if: failure()
        run: |
          set -eu
          if ! docker image inspect sh-mpd-at:rollback >/dev/null 2>&1 ; then
            echo "no rollback image tagged; manual recovery required" >&2
            exit 0
          fi
          RUNNING=$(docker inspect shmpd --format '{{.Image}}' 2>/dev/null || true)
          ROLLBACK=$(docker image inspect sh-mpd-at:rollback --format '{{.Id}}')
          if [ "${RUNNING}" = "${ROLLBACK}" ]; then
            echo "running image is already the rollback image (failure before container swap, or already rolled back); production untouched"
            exit 0
          fi
          echo "rolling back: production is not on the rollback image" >&2
          docker container stop shmpd || true
          docker container rm shmpd || true
          sh tools/docker_shmpd.sh sh-mpd-at:rollback

      - name: summary
        if: success() && steps.rebuild.outputs.done != 'true'
        run: |
          echo "deployed: working tree only (image-baked files unchanged, container untouched; smoke passed)"
