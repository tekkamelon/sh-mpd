# sh-MPD 本番 Apache 設定
#
# 旧イメージでは apache2.conf の末尾に追記されていた設定を conf-available へ分離した。
#
# ScriptAlias ではなく Alias + AddHandler を使う: ScriptAlias はディレクトリ配下の
# 全ファイルを CGI 扱いにするため, cgi-bin/stylesheet/*.css などの静的資産が
# 実行されてしまう (旧構成は AddHandler text/html .css で回避していた)。

ServerSignature Off
ServerTokens ProductOnly
ServerName pop-os.local:80

# CGI はリポジトリの cgi-bin を直接実行する (ホストで git pull すれば反映される)
Alias /cgi-bin/ "/home/shmpd/Documents/github/sh-mpd/cgi-bin/"

<Directory "/home/shmpd/Documents/github/sh-mpd/cgi-bin/">
	AllowOverride None
	Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
	Require all granted
</Directory>

<Directory "/home/shmpd/Documents/github/sh-mpd">
	Options Indexes FollowSymLinks
	AllowOverride None
	Require all granted
</Directory>

# .cgi と .sh のみ CGI として実行し, .css .svg 等は静的配信する
AddHandler cgi-script .cgi .sh
